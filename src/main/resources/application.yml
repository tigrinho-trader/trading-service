server:
  port: 8081

spring:
  application:
    name: trading-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trading}
    username: ${DB_USER:tigrinho}
    password: ${DB_PASSWORD:tigrinho}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

mensageria:
  exchange: tigrinho.eventos

trading:
  market-data-url: ${MARKET_DATA_URL:http://localhost:8083}
  wallet-url: ${WALLET_URL:http://localhost:8082}
  timeout: 3s
  resolucao-intervalo-ms: 1000

flecha:
  # sessao aberta sem atividade por mais que isso e encerrada automaticamente
  expira-apos: ${FLECHA_EXPIRA_APOS:10m}
  intervalo-minimo-tiro: 150ms
  # flechas de mercado que sobram voltam ao encerrar com este desconto (0.002 = 0,1% em cada ponta real/dolar)
  taxa-devolucao: ${FLECHA_TAXA_DEVOLUCAO:0.002}
  agendador:
    habilitado: ${FLECHA_AGENDADOR_HABILITADO:true}
    intervalo-ms: 60000

# Estudo da sabedoria das massas: cada flecha bitcoin vira uma operacao na direcao prevista pelo jogador.
# SIMULADO (padrao): registra e calcula com o preco real, sem ordens. REAL: ordens na margem isolada da Binance,
# com o dinheiro do dono do jogo. So o dono liga o REAL (ESTUDO_MODO=REAL + chave no ambiente).
estudo:
  modo: ${ESTUDO_MODO:SIMULADO}
  simbolo: BTCUSDT
  margem-brl: ${ESTUDO_MARGEM_BRL:10}
  alavancagem: ${ESTUDO_ALAVANCAGEM:3}
  fecha-apos: 5s
  taxa-simulada: 0.001
  cambio-reserva: ${ESTUDO_CAMBIO_RESERVA:5.50}
  max-operacoes-dia: ${ESTUDO_MAX_OPERACOES_DIA:300}
  max-abertas: ${ESTUDO_MAX_ABERTAS:5}
  perda-maxima-dia-brl: ${ESTUDO_PERDA_MAXIMA_DIA_BRL:50}
  intervalo-por-jogador: 1s
  # placar da aposta binaria (+ no acerto, - no erro): so metrica do estudo, nao move dinheiro
  aposta-binaria-brl: 10
  revisao-habilitada: true
  revisao-ms: 30000
  binance:
    url: ${BINANCE_URL:https://api.binance.com}
    # a chave vem SO do ambiente; nunca no repositorio
    api-key: ${BINANCE_API_KEY:}
    api-secret: ${BINANCE_API_SECRET:}
    recv-window: 5000
    timeout: 5s

# Opções Deriv usadas somente pelo pássaro V100. O modo padrão é SIMULADO.
# São as três variáveis que devem ser preenchidas no EasyPanel para ligar o REAL:
# DERIV_API_TOKEN, DERIV_APP_ID e DERIV_TRADING_MODE=REAL.
deriv:
  api-token: ${DERIV_API_TOKEN:}
  app-id: ${DERIV_APP_ID:}
  account-id: ${DERIV_ACCOUNT_ID:}
  mode: ${DERIV_TRADING_MODE:SIMULADO}
  rest-url: ${DERIV_REST_URL:https://api.derivws.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
