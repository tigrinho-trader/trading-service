spring:
  datasource:
    url: jdbc:h2:mem:trading;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    listener:
      simple:
        auto-startup: false

trading:
  market-data-url: http://market-data.test
  wallet-url: http://wallet.test
  # nos testes o resolvedor e chamado na mao
  resolucao-intervalo-ms: 3600000

flecha:
  # os testes da cobranca usam a entrada de tabela (0,5 / 1,5 / 4 / 10); a entrada livre tem testes proprios
  entrada-livre: false
  # as contas dos testes usam a devolucao a 0,2% (o padrao de producao e 1%)
  taxa-devolucao: 0.002
  # nos testes o encerramento automatico e chamado na mao
  agendador:
    habilitado: false

estudo:
  # nos testes a revisao das operacoes e chamada na mao
  revisao-habilitada: false
  revisao-ms: 3600000
